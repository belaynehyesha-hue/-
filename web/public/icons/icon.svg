<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17202e"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#E5A900"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#007A33"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#323c52" stroke-width="6"/>

  <!-- Ethiopian Flag subtle accent bar -->
  <g transform="translate(156, 70)">
    <rect x="0" y="0" width="66" height="8" rx="4" fill="#007A33"/>
    <rect x="68" y="0" width="66" height="8" rx="4" fill="#FFDE00"/>
    <rect x="136" y="0" width="66" height="8" rx="4" fill="#DA121A"/>
  </g>

  <!-- Construction Crane / Architectural Structure -->
  <g transform="translate(96, 110)">
    <!-- Base building columns -->
    <rect x="50" y="160" width="40" height="180" rx="6" fill="#252d3d" stroke="#475569" stroke-width="4"/>
    <rect x="110" y="120" width="50" height="220" rx="6" fill="#334155" stroke="#64748b" stroke-width="4"/>
    <rect x="180" y="80" width="60" height="260" rx="6" fill="#1e293b" stroke="#00A896" stroke-width="4"/>
    <rect x="260" y="140" width="40" height="200" rx="6" fill="#252d3d" stroke="#475569" stroke-width="4"/>

    <!-- Windows grid -->
    <rect x="125" y="145" width="20" height="15" rx="3" fill="#FFDE00" opacity="0.85"/>
    <rect x="125" y="175" width="20" height="15" rx="3" fill="#FFDE00" opacity="0.85"/>
    <rect x="125" y="205" width="20" height="15" rx="3" fill="#FFDE00" opacity="0.85"/>
    <rect x="195" y="110" width="30" height="20" rx="4" fill="#00A896" opacity="0.85"/>
    <rect x="195" y="150" width="30" height="20" rx="4" fill="#00A896" opacity="0.85"/>
    <rect x="195" y="190" width="30" height="20" rx="4" fill="#FFDE00" opacity="0.85"/>

    <!-- Tower Crane / Ruler Geometry -->
    <line x1="210" y1="80" x2="210" y2="20" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="20" x2="310" y2="20" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <line x1="210" y1="20" x2="160" y2="45" stroke="url(#gold)" stroke-width="4"/>
    <line x1="210" y1="20" x2="260" y2="45" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="285" cy="45" r="8" fill="#FFDE00"/>
    <line x1="285" y1="20" x2="285" y2="45" stroke="#FFDE00" stroke-width="3" stroke-dasharray="4,4"/>

    <!-- Safety Badge Shield Symbol -->
    <g transform="translate(10, 240)">
      <circle cx="45" cy="45" r="42" fill="#007A33" stroke="#FFDE00" stroke-width="4"/>
      <path d="M 45 20 L 70 30 L 70 52 C 70 68 45 78 45 78 C 45 78 20 68 20 52 L 20 30 Z" fill="#FFDE00"/>
      <path d="M 36 47 L 42 53 L 56 39" fill="none" stroke="#007A33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Platform Brand Text -->
  <text x="256" y="475" text-anchor="middle" font-family="'Noto Sans Ethiopic', sans-serif" font-size="28" font-weight="bold" fill="#FFDE00" letter-spacing="1">ቲሊሊ ኮንስትራክሽን</text>
</svg>
